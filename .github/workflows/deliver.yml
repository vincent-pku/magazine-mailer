name: Magazine Mailer

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover and validate without sending email or updating state
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: magazine-mailer
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest -q

      - name: Run magazine mailer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python -m magazine_mailer --dry-run
          else
            python -m magazine_mailer
          fi

      - name: Persist delivery state
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        shell: bash
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: update magazine delivery state"
          git push origin HEAD:main
