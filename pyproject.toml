[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magazine-mailer"
version = "0.1.0"
description = "Automatically email new magazine EPUBs from a pluggable source."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
